[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-security-platform"
version = "0.1.0"
description = "SMS-pumping fraud analytics with a FastAPI fraud operations API and IAM"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.1",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.0.0", "bandit>=1.7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["common*", "fraud_engine*", "synthetic_data*", "backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
